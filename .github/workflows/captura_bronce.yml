name: Captura Bronce

on:
  schedule:
    - cron: "0 13 * * *"   # 07:00 hora del centro de México
  workflow_dispatch:

permissions:
  contents: write

jobs:
  captura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Extraer Banxico (API)
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: python src/bronce/extraer_banxico.py

      - name: Extraer SNIIM (scraping ético)
        continue-on-error: true
        env:
          SNIIM_PRODUCTO_ID: ${{ vars.SNIIM_PRODUCTO_ID }}
          SNIIM_URL: ${{ vars.SNIIM_URL }}
        run: python src/bronce/extraer_sniim.py

      - name: Guardar datos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bronce logs
          git diff --cached --quiet || git commit -m "captura bronce: $(date -u +%F)"
          git push
